tlePlain:`Pourquoi associer `,titleAura:`SOLID et les Patrons GoF ?`,subtitle:`Un logiciel passe plus de 80 % de sa vie en maintenance et évolution. Sans architecture, chaque nouvelle fonctionnalité casse l’existant.`,leftCard:{label:`DIAGNOSTIC DU CODE SPAGHETTI`,title:`Les 4 symptômes d’une mauvaise conception POO`,bullets:[`Rigidité : modifier un détail force à recompiler et retester des dizaines de classes.`,`Fragilité : corriger un bug dans un module provoque des régressions ailleurs.`,`Immobilité : impossible de réutiliser un composant tant il est couplé au reste.`,`Viscosité : faire un hack rapide devient plus facile que suivre une structure propre.`],callouts:[{type:`info`,title:`SOLID = Le Diagnostic (Quoi respecter)`,body:`5 principes de conception (Robert C. Martin) qui guident le découpage des classes et des interfaces.`},{type:`good`,title:`GoF = Les Solutions (Comment structurer)`,body:`Catalogue de 23 solutions réutilisables (1994) qui concrétisent les principes SOLID en pratique.`}]},tabs:[{id:`couplage-bad`,label:`❌ Couplage Fort`,kind:`bad`,code:`// Anti-pattern classique : tout est figé et entremêlé

public class OrderProcessor {
    private final OrderRepository repository;      // DIP
    private final List<OrderObserver> observers;   // Observer

    public OrderProcessor(OrderRepository repository,
                          List<OrderObserver> observers) {
        this.repository = repository;
        this.observers = observers;
    }

    public void process(Order order, PaymentStrategy payment) {
        payment.pay(order.getTotal());             // Strategy (OCP)
        repository.save(order);                    // SRP + DIP
        observers.forEach(o -> o.onOrderPaid(order));
    }
}`}],speakerNotes:`Point clé : insistez sur la complémentarité ! SOLID fixe les règles d’hygiène objet (faible couplage, forte cohésion), tandis que les patrons GoF sont les plans d’assemblage concrets qui appliquent ces règles.`},{id:`solid-overview`,chapter:`solid`,layout:`pillars`,eyebrow:`02 · Principes de Conception Orientée Objet`,badge:`Robert C. Martin`,titlePlain:`Les 5 Piliers `,titleAura:`S · O · L · I · D`,subtitle:`Cliquez sur une carte pour accéder directement à son étude détaillée avec diagramme UML et code Java avant/après.`,pillars:[{letter:`S`,name:`Single Responsibility`,fr:`Responsabilité Unique`,summary:`Une classe ne doit avoir qu’une seule et unique raison de changer.`,targetSlide:3},{letter:`O`,name:`Open / Closed`,fr:`Ouvert / Fermé`,summary:`Ouvert à l’extension par polymorphisme, fermé à la modification du code existant.`,targetSlide:4},{letter:`L`,name:`Liskov Substitution`,fr:`Substitution de Liskov`,summary:`Tout sous-type doit pouvoir remplacer son type parent sans altérer la cohérence.`,targetSlide:5},{letter:`I`,name:`Interface Segregation`,fr:`Ségrégation des Interfaces`,summary:`Mieux vaut plusieurs petites interfaces ciblées qu’une interface « fourre-tout ».`,targetSlide:6},{letter:`D`,name:`Dependency Inversion`,fr:`Inversion des Dépendances`,summary:`Dépendre d’abstractions (interfaces), jamais d’implémentations concrètes.`,targetSlide:7}],bottomBanner:`Objectif global de SOLID : Haute Cohésion interne + Faible Couplage entre modules + Testabilité unitaire maximale.`,speakerNotes:`Transition : présentez brièvement l’acronyme popularisé par Robert C. Martin (« Uncle Bob »), puis détaillez chacun des 5 principes avec un contre-exemple et sa refactorisation Java.`},{id:`solid-srp`,chapter:`solid`,layout:`split`,eyebrow:`Principes SOLID · [S] — 1 / 5`,badge:`SRP`,titlePlain:`Single Responsibility `,titleAura:`Principle (SRP)`,subtitle:`« Une classe ne doit avoir qu’une seule raison de changer, c’est-à-dire une seule responsabilité m public interface Shape {
    int area();
}

public final class Rectangle implements Shape {
    private final int width;
    private final int height;

    public Rectangle(int width, int height) {
        this.width = width;
        this.height = height;
    }
    @Override
    public int area() { return width * height; }
}

public final class Square implements Shape {
    private final int side;

    public Square(int side) { this.side = side; }

    @Override
    public int area() { return side * side; }
}`},{id:`lsp-bad`,label:`❌ Violation LSP`,kind:`bad`,code:`class Rectangle {
    protected int width, height;
    public void setWidth(int w)  { this.width = w; }
    public void setHeight(int h) { this.height = h; }
    public int area() { return width * height; }
}

class Square extends Rectangle {
    @Override
    public void setWidth(int w)  { this.width = w; this.height = w; }
    @Override
    public void setHeight(int h) { this.width = h; this.height = h; }
}

// ❌ Test client cassé lorsqu'on passe new Square() :
void verifyArea(Rectangle r) {

u livre fondateur de 1994 (« Design Patterns: Elements of Reusable Object-Oriented Software ») : Erich Gamma, Richard Helm, Ralph Johnson et John Vlissides — surnommés le Gang of Four (GoF).`},{id:`gof-singleton`,chapter:`creational`,layout:`split`,eyebrow:`Patron GoF #1 · Famille Création`,badge:`Singleton`,titlePlain:`Patron `,titleAura:`Singleton`,subtitle:`Garantir qu’une classe ne possède qu’une seule instance en mémoire JVM et fournir un point d’accès global unique à celle-ci.`,diagram:`singleton`,simulator:`singleton`,leftCard:{label:`FICHE ARCHITECTURALE`,title:`Mécanisme en 3 règles Java strictes`,bullets:[`1. Constructeur private : interdit tout appel externe à new DatabaseConnection().`,`2. Attribut private static volatile : stocke l’unique référence partagée.`,`3. Méthode public static getInstance() : instancie paresseusement (lazy) de façon Thread-Safe.`],callouts:[{type:`good`,title:`Cas d’usage typiques`,body:`Pool de connexion BDD, Configuration globale, Logger central, Runtime.getRuntime().`},{type:`bad`,title:`Vigilance SOLID !`,body:`Abuser du Singleton crée un état global caché qui complique les tests unitaires (tension SRP/DIP).`}]},tabs:[{id:`singleton-java`,label:`DatabaseConnection.java`,kind:`good`,code:`public final class DatabaseConnection {

    // volatile garantit la visibilité mémoire entre threads JVM
    private static volatile DatabaseConnection instance;

    // 1. Constructeur privé : empêche 'new DatabaseConnection()'
    private DatabaseConnection() {
        System.out.println("Initialisation unique de la connexion...");
    }

    // 2. Double-Checked Locking (Thread-Safe & performant)
    public static DatabaseConnection getInstance() {
        if (instance == null) {
            synchronized (DatabaseConnection.class) {
                if (instance == null) {
                    instance = new DatabaseConnection();
                }
            }
        }
        return instance;
    }

    public void query(String sql) {
        System.out.println("[SQL] " + sql);
    }
}`},{id:`singleton-usage`,label:`Main.java`,kind:`default`,code:`public class Main {
    public static void main(String[] args) {
        // new DatabaseConnection(); // ❌ Erreur de compilation !

        DatabaseConnection db1 = DatabaseConnection.getInstance();
        DatabaseConnection db2 = DatabaseConnection.getInstance();

        db1.query("SELECT * FROM students");

        // Preuve d'unicité de la référence en mémoire :
        System.out.println(db1 == db2); // true (même adresse JVM !)
    }
}`}],speakerNotes:`Astuce bonus pour impressionner le prof : mentionnez le mot-clé volatile du Double-Checked Locking en Java, et cliquez sur l’onglet « ▶ Démo Live » pour prouver que db1 == db2 renvoie la même adresse mémoire @7a81197d !`},{id:`gof-factory`,chapter:`creational`,layout:`split`,eyebrow:`Patron GoF #2 · Famille Création`,badge:`Factory`,titlePlain:`Patron `,titleAura:`Factory (Fabrique)`,subtitle:`Centraliser et encapsuler la création d’objets polymorphes pour que le code client ne dépende que de l’interface commune.`,diagram:`factory`,simulator:`factory`,leftCard:{label:`DÉCOUPLAGE DE L’INSTANCIATION`,title:`Séparer l’utilisation d’un objet de sa fabrication`,bullets:[`Problème : disperser new EmailNotification() dans 40 classes rend toute évolution coûteuse.`,`Solution : le client demande une Notification à la fabrique sans connaître la classe concrète.`,`Évolution Factory Method (GoF pur) : des sous-classes de Creator redéfinissent createNotification() pour respecter pleinement OCP.`]},tabs:[{id:`factory-java`,label:`NotificationFactory.java`,kind:`good`,code:`public interface Notification {
    void notifyUser(String message);
}

class EmailNotification implements Notification {
    public void notifyUser(String msg) {
        System.out.println("[EMAIL] Envoi SMTP : " + msg);
    }
}

class SmsNotification implements Notification {
    public void notifyUser(String msg) {
        System.out.println("[SMS] Envoi opérateur : " + msg);
    }
}

class PushNotification implements Notification {
    public void notifyUser(String msg) {
        System.out.println("[PUSH] Notification mobile : " + msg);
    }
}

public class NotificationFactory {
    public static Notification create(String channel) {
        return switch (channel.toUpperCase()) {
            case "EMAIL" -> new EmailNotification();
            case "SMS"   -> new SmsNotification();
            case "PUSH"  -> new PushNotification();
            default -> throw new IllegalArgumentException("Canal inconnu");
        };
    }
}`},{id:`factory-method-gof`,label:`FactoryMethod (GoF pur)`,kind:`default`,code:`// Variante Factory Method 100 % conforme à Open/Closed (OCP) :
public abstract class NotificationCreator {

    // La « Factory Method » abstraite déléguée aux sous-classes
    protected abstract Notification createNotification();

    public void sendAlert(String message) {
        Notification notif = createNotification();
        notif.notifyUser(message);
    }
}

public class EmailCreator extends NotificationCreator {
    @Override
    protected Notification createNotification() {
        return new EmailNotification();
    }
}

public class SmsCreator extends NotificationCreator {
    @Override
    protected Notification createNotification() {

    void update(double temperature);
}

public class WeatherStation {
    private final List<Observer> observers = new ArrayList<>();
    private double temperature;

    public void subscribe(Observer obs)   { observers.add(obs); }
    public void unsubscribe(Observer obs) { observers.remove(obs); }

    public void setTemperature(double newTemp) {
        this.temperature = newTemp;
        notifyObservers(); // Diffusion automatique !
    }

    private void notifyObservers() {
        for (Observer obs : observers) {
            obs.update(this.temperature);
        }
    }
}

public class PhoneDisplay implements Observer {
    public void update(double temp) {
        System.out.println("[Mobile] Nouvelle météo : " + temp + " °C");
    }

igner que Singleton est en tension avec SRP et DIP montre un vrai recul critique d’ingénieur plutôt qu’une récitation par cœur !`},{id:`quiz-conclusion`,chapter:`synthesis`,layout:`conclusion`,eyebrow:`07 · Validation des Acquis & Conclusion`,badge:`Q&R Interactive`,titlePlain:`Quiz Express & `,titleAura:`Règles d’Or à Retenir`,subtitle:`Testez la reconnaissance des patrons sur des cas concrets de cours, puis retenez les 3 maximes fondamentales du Génie Logiciel.`,maxims:[{num:`01`,title:`Programmer vers une interface, pas une implémentation`,body:`Déclarez toujours vos variables et paramètres avec le type abstrait (List, Notification, PaymentStrategy) pour préserver l’évolutivité (DIP / LSP).`},{num:`02`,title:`Privilégier la composition d’objets à l’héritage de classes`,body:`Strategy et Decorator prouvent que déléguer le travail à un objet injecté est bien plus flexible à l’exécution qu’une hiérarchie figée.`},{num:`03`,title:`Identifier ce qui varie et l’encapsuler`,body:`N’appliquez pas les 23 patrons partout (pas de sur-ingénierie !) : introduisez un patron là où un axe de changement réel apparaît.`}],quiz:[{q:`Cas 1 : Vous voulez calculer les frais de port selon 5 transporteurs interchangeables à l’exécution sans if/else.`,options:[`Singleton`,`Strategy`,`Observer`,`ISP`],answer:1,explain:`Exact ! Strategy encapsule chaque algorithme de calcul dans une classe dédiée interchangeable au runtime.`},{q:`Cas 2 : Vous souhaitez ajouter optionnellement du logging, de la compression et du chiffrement autour d’un flux de données.`,options:[`Factory`,`Singleton`,`Decorator`,`LSP`],answer:2,explain:`Exact ! Decorator enveloppe dynamiquement l’objet de base (« poupées russes ») sans explosion de sous-classes.`},{q:`Cas 3 : Lorsqu’un produit en rupture revient en stock, 150 clients inscrits doivent recevoir une alerte automatiquement.`,options:[`Observer`,`Singleton`,`Decorator`,`SRP`],answer:0,explain:`Exact ! Observer (Publish/Subscribe) notifie tous les abonnés enregis
