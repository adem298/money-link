[package]
name = "money_link"
version = "0.1.0"
description = "Non-custodial USDC claim-link escrow for Solana"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "money_link"

[features]
default = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
devnet-usdc = []

[dependencies]
anchor-lang = "0.31.1"
anchor-spl = { version = "0.31.1", features = ["associated_token", "token"] }
